{% extends "base.html" %}

{% block title %}Register - Organ Matching System{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Register as Doctor or Admin</p>
        </div>

        {% if error %}
        <div class="alert alert-error">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="Enter full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter email">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Choose username">
            </div>

            <div class="form-group">
                <label for="role">Select Role <span style="color: #F44336;">*</span></label>
                <select id="role" name="role" required onchange="updateRoleMessage()">
                    <option value="">-- Select Your Role --</option>
                    <option value="doctor">👨‍⚕️ Doctor (Medical Professional)</option>
                    <option value="admin">👨‍💼 Admin (System Administrator)</option>
                </select>
                <small id="roleMessage" style="color: #757575; margin-top: 5px; display: block;"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password (min 6 chars)">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm password">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
        </div>

        
    </div>
</div>

<script>
function updateRoleMessage() {
    const roleSelect = document.getElementById('role');
    const roleMessage = document.getElementById('roleMessage');

    if (roleSelect.value === 'doctor') {
        roleMessage.innerHTML = '✓ You will have access to the <strong>Doctor Dashboard</strong>';
        roleMessage.style.color = '#4CAF50';
    } else if (roleSelect.value === 'admin') {
        roleMessage.innerHTML = '✓ You will have access to the <strong>Admin Dashboard</strong>';
        roleMessage.style.color = '#FF9800';
    } else {
        roleMessage.textContent = '';
    }
}
</script>
{% endblock %}
